<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WickedMurder© — Player</title>
<script src="https://w.soundcloud.com/player/api.js"></script>
<style>
  :root{
    --bg:#050505;
    --surface:#101010;
    --surface-2:#171717;
    --surface-hover:#242424;
    --text:#ffffff;
    --text-dim:#a7a7a7;
    --accent:#1ed760;
    --accent-dim:#1db954;
    --accent-red:#ff3347;
    --border:rgba(255,255,255,.09);
    --bar-off:#353535;
    --glass:rgba(12,12,12,.68);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    width:100%;height:100%;
    overflow:hidden;            /* all scrolling happens inside .sidebar/.main, never on the page itself */
    overscroll-behavior:none;   /* stop iOS/Android bounce from revealing space beyond the app frame */
    background:var(--bg);color:var(--text);
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    background:none;
    color:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .play-pill,.track-row,.album-card,.np-playbtn{
    touch-action:manipulation;
  }

  /* If you embed this page via <iframe src="...">, give the iframe itself
     style="width:100%;height:100%;border:0;display:block" and make sure ITS
     parent element has a real height set. An <iframe> with no size defaults
     to a tiny 300x150 box floating inside whatever background is behind it --
     that mismatch is the usual cause of "black space" around an embed. */
  .app{
    display:grid;
    grid-template-columns:240px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) auto;
    width:100%;
    height:100vh;   /* fallback for browsers without dvh support */
    height:100dvh;  /* real visible height on mobile -- adjusts for the address bar */
    gap:8px;
    padding:
      max(8px, env(safe-area-inset-top))
      max(8px, env(safe-area-inset-right))
      max(8px, env(safe-area-inset-bottom))
      max(8px, env(safe-area-inset-left));
    background:
      radial-gradient(circle at 80% 20%, rgba(255,40,60,.055), transparent 34%),
      radial-gradient(circle at 20% 80%, rgba(30,215,96,.035), transparent 30%),
      #050505;
  }

  /* Sidebar */
  .sidebar{
    grid-row:1;
    background:var(--surface);
    border-radius:8px;
    padding:20px 16px;
    overflow-y:auto;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:6px 8px 22px;
    font-weight:800;font-size:20px;letter-spacing:.2px;
  }
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;}
  .nav-item{
    display:flex;align-items:center;gap:14px;
    padding:9px 8px;border-radius:4px;
    color:var(--text-dim);font-size:14px;font-weight:600;
  }
  .nav-item.active{color:var(--text);}
  .nav-item svg{width:20px;height:20px;flex:none;}
  .sidebar hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
  .side-meta{padding:0 8px;color:var(--text-dim);font-size:12px;line-height:1.7;}
  .side-meta strong{color:var(--text);display:block;font-size:13px;margin-bottom:2px;}

  /* Main */
  .main{
    grid-row:1;
    min-width:0;
    min-height:0;
    background:
      radial-gradient(900px 520px at 78% 7%, rgba(255,45,55,.16), transparent 70%),
      radial-gradient(700px 480px at 18% 35%, rgba(120,20,30,.10), transparent 72%),
      linear-gradient(180deg,#321719 0%,#151010 300px,#101010 620px,#0d0d0d 100%);
    border-radius:8px;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
    isolation:isolate;
  }
  .main::after{
    content:"";
    position:absolute;
    left:0;right:0;top:250px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
    pointer-events:none;
    z-index:0;
  }

  /* The glare lives on the complete tracks section, not the viewport-sized
     .main element. This keeps the sweep covering every loaded track row. */
  .tracks-section{
    position:relative;
    overflow:hidden;
    isolation:isolate;
  }
  .tracks-section::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
    background:
      linear-gradient(
        112deg,
        transparent 0%,
        transparent 34%,
        rgba(255,255,255,.010) 42%,
        rgba(255,75,90,.065) 48%,
        rgba(255,255,255,.030) 52%,
        rgba(255,255,255,.010) 58%,
        transparent 66%,
        transparent 100%
      );
    background-size:230% 100%;
    background-position:-120% 0;
    animation:trackGlare 13s cubic-bezier(.45,.05,.55,.95) infinite;
    mix-blend-mode:screen;
  }
  .tracks-section::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
    background:radial-gradient(
      520px 260px at 75% 20%,
      rgba(255,35,55,.045),
      transparent 72%
    );
    animation:trackGlow 7s ease-in-out infinite alternate;
  }
  .tracks-section > .section-title,
  .tracks-section > .track-list{
    position:relative;
    z-index:1;
  }
  @keyframes trackGlare{
    0%{background-position:-120% 0;}
    42%,100%{background-position:120% 0;}
  }
  @keyframes trackGlow{
    from{opacity:.45;transform:translate3d(-1%,0,0) scale(1);}
    to{opacity:1;transform:translate3d(1%,1%,0) scale(1.025);}
  }

  .topbar{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;background:rgba(0,0,0,0);
  }
  .topbar-nav{display:flex;gap:8px;}
  .circle-btn{
    width:32px;height:32px;border-radius:50%;
    background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
  }
  .circle-btn svg{width:16px;height:16px;}

  .profile-header{
    display:flex;align-items:flex-end;gap:24px;
    padding:24px 24px 28px;
  }
  .profile-header img{
    width:180px;height:180px;border-radius:50%;
    box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12),0 0 55px rgba(255,45,60,.16);
    object-fit:cover;background:var(--surface-2);
    animation:vinylFloat 5s ease-in-out infinite;
  }
  .profile-header img:hover{
    animation:vinylSpin 2.2s linear infinite;
    box-shadow:0 18px 48px rgba(0,0,0,.65),0 0 0 2px rgba(255,255,255,.18),0 0 75px rgba(255,45,60,.24);
  }
  @keyframes vinylFloat{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-5px) rotate(1deg)}
  }
  @keyframes vinylSpin{to{transform:rotate(360deg)}}
  .profile-header .kicker{font-size:12px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:6px;}
  .verified-badge{width:14px;height:14px;flex:none;}
  .profile-header h1{
    font-size:64px;line-height:1.05;margin:6px 0 16px;font-weight:900;
    letter-spacing:-1px;
  }
  .profile-header .sub{color:var(--text-dim);font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .profile-header .sub b{color:var(--text);font-weight:700;}

  .action-row{
    display:flex;align-items:center;gap:24px;
    padding:20px 24px 8px;
  }
  .play-pill{
    width:56px;height:56px;border-radius:50%;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
    box-shadow:0 0 0 0 rgba(30,215,96,.35);
  }
  .play-pill:hover{
    transform:scale(1.07);
    background:#22e065;
    box-shadow:0 0 0 9px rgba(30,215,96,.07),0 0 32px rgba(30,215,96,.22);
  }
  .play-pill.is-playing{animation:playPulse 1.8s ease-in-out infinite;}
  @keyframes playPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(30,215,96,.22)}
    50%{box-shadow:0 0 0 11px rgba(30,215,96,0),0 0 34px rgba(30,215,96,.18)}
  }
  .play-pill svg{width:22px;height:22px;fill:#000;margin-left:2px;}
  .follow-btn{
    border:1px solid #5a5a5a;color:var(--text);
    padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;
  }
  .follow-btn:hover{border-color:var(--text);}

  .section-title{
    padding:24px 24px 8px;font-size:22px;font-weight:800;
  }

  .track-list{padding:0 24px 24px;}
  .track-list-head{
    display:grid;grid-template-columns:32px 1fr 110px 140px;gap:16px;
    padding:0 12px 8px;border-bottom:1px solid var(--border);
    color:var(--text-dim);font-size:12px;font-weight:600;
  }
  .track-row{
    display:grid;grid-template-columns:32px 1fr 110px 140px;gap:16px;align-items:center;
    padding:8px 12px;border-radius:4px;
  }
  .track-row{
    transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  .track-row:hover{
    background:linear-gradient(90deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    transform:translateX(3px);
  }
  .track-row.playing{
    background:linear-gradient(90deg,rgba(30,215,96,.10),rgba(255,255,255,.018));
    box-shadow:inset 2px 0 0 var(--accent);
  }
  .idx-cell{position:relative;color:var(--text-dim);font-size:14px;text-align:center;}
  .idx-num{display:block;}
  .idx-play{display:none;}
  .track-row:hover .idx-num,.track-row.playing .idx-num{display:none;}
  .track-row:hover .idx-play,.track-row.playing .idx-play{display:flex;align-items:center;justify-content:center;}
  .track-row.playing .idx-num{color:var(--accent);}
  .idx-play svg{width:12px;height:12px;fill:var(--text);}

  .title-cell{display:flex;align-items:center;gap:12px;min-width:0;}
  .title-cell img{width:40px;height:40px;border-radius:3px;object-fit:cover;background:var(--surface-2);flex:none;}
  .title-text{min-width:0;}
  .title-text .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .title-text .a{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track-row.playing .t{color:var(--accent);}

  .plays-cell{color:var(--text-dim);font-size:13px;}
  .date-cell{color:var(--text-dim);font-size:13px;}

  .empty-note{color:var(--text-dim);font-size:13px;padding:8px 12px;}

  .albums-grid{display:flex;flex-wrap:wrap;gap:20px;padding:0 24px 28px;}
  .album-card{width:160px;}
  .album-card .art-wrap{
    position:relative;width:160px;height:160px;border-radius:8px;overflow:hidden;
    background:var(--surface-2);
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    transition:transform .22s ease,box-shadow .22s ease;
  }
  .album-card:hover .art-wrap{
    transform:translateY(-5px) scale(1.025);
    box-shadow:0 18px 38px rgba(0,0,0,.55),0 0 28px rgba(255,45,60,.10);
  }
  .album-card img{width:100%;height:100%;object-fit:cover;display:block;}
  .album-card .play-overlay{
    position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
    opacity:0;transform:translateY(6px);
    transition:opacity .15s ease, transform .15s ease;
  }
  .album-card .play-overlay svg{width:16px;height:16px;fill:#000;margin-left:2px;}
  .album-card:hover .play-overlay,.album-card.playing .play-overlay{opacity:1;transform:translateY(0);}
  .album-card .a-title{
    margin-top:10px;font-size:14px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .album-card.playing .a-title{color:var(--accent);}
  .album-card .a-sub{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .album-card{cursor:pointer;}

  /* SoundCloud engine.
     Keep it mounted and in the document. Mobile Safari/Chrome are much less
     likely to suspend a cross-origin media iframe when it is not repeatedly
     destroyed/recreated during playback. */
  .sc-audio-engine{
    position:fixed;
    left:-9999px;
    bottom:0;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
    border:0;
    z-index:-1;
  }

  /* Now playing bar (fake waveform UI) */
  .nowplaying{
    grid-column:1 / -1;
    background:linear-gradient(135deg,rgba(28,28,28,.96),rgba(10,10,10,.96));
    border:1px solid rgba(255,255,255,.08);
    border-radius:8px;
    display:none;
    align-items:center;
    gap:20px;
    padding:10px 16px;
    height:88px;
    box-shadow:0 -10px 35px rgba(0,0,0,.28),0 0 35px rgba(255,35,55,.06);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .nowplaying.show{animation:playerIn .28s ease-out both;}
  @keyframes playerIn{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }
  .nowplaying.show{display:flex;}
  .np-meta{display:flex;align-items:center;gap:12px;width:220px;flex:none;min-width:0;}
  .np-meta img{width:56px;height:56px;border-radius:3px;object-fit:cover;background:var(--surface-2);flex:none;}
  .np-meta .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .np-meta .a{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .np-center{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .np-transport{display:flex;align-items:center;gap:18px;}
  .np-transport button{color:var(--text-dim);}
  .np-transport button:hover{color:var(--text);}
  .np-transport svg{width:16px;height:16px;fill:currentColor;}
  .np-playbtn{
    width:30px;height:30px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .np-playbtn svg{width:14px;height:14px;fill:#000;}
  .np-playbtn:hover{transform:scale(1.06);}

  .np-progress{display:flex;align-items:center;gap:8px;width:100%;max-width:560px;}
  .np-time{font-size:11px;color:var(--text-dim);width:36px;flex:none;}
  .np-time.end{text-align:left;}
  .np-time.start{text-align:right;}
  .waveform{
    flex:1;height:32px;display:flex;align-items:flex-end;gap:1px;cursor:pointer;position:relative;
  }
  .waveform .bar{
    flex:1;min-width:1px;background:var(--bar-off);border-radius:1px;
    transition:background-color .1s linear;
  }
  .waveform .bar.played{background:var(--accent);box-shadow:0 0 7px rgba(30,215,96,.28);}
  .nowplaying.show .waveform .bar{
    animation:waveIdle 1.1s ease-in-out infinite alternate;
    animation-play-state:paused;
  }
  .nowplaying.is-playing .waveform .bar{animation-play-state:running;}
  .waveform .bar:nth-child(3n){animation-delay:-.35s!important}
  .waveform .bar:nth-child(4n){animation-delay:-.7s!important}
  @keyframes waveIdle{
    from{transform:scaleY(.78)}
    to{transform:scaleY(1.08)}
  }

  .np-right{width:150px;flex:none;display:flex;justify-content:flex-end;}
  .vol-wrap{display:flex;align-items:center;gap:8px;width:140px;}
  .vol-icon{color:var(--text-dim);flex:none;}
  .vol-icon:hover{color:var(--text);}
  .vol-icon svg{width:18px;height:18px;fill:currentColor;}
  .vol-slider{
    -webkit-appearance:none;appearance:none;
    width:100px;height:4px;border-radius:2px;outline:none;
    background:linear-gradient(to right, var(--accent) 0%, var(--accent) 80%, #4d4d4d 80%, #4d4d4d 100%);
  }
  .vol-slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#fff;cursor:pointer;
  }
  .vol-slider::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:#fff;border:none;cursor:pointer;
  }

  ::-webkit-scrollbar{width:12px;}
  ::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:6px;border:3px solid var(--surface);}

  /* Mobile menu button + backdrop (hidden on desktop) */
  .menu-btn{display:none;}
  .sidebar-backdrop{display:none;}

  @media (max-width:768px){
    .app{grid-template-columns:1fr;padding:0;gap:0;min-height:100dvh;}
    .main{padding-bottom:10px;}

    .sidebar{
      position:fixed;top:0;left:0;bottom:0;width:250px;z-index:50;
      border-radius:0;transform:translateX(-100%);
      transition:transform .25s ease;
      box-shadow:4px 0 28px rgba(0,0,0,.6);
      padding-top:calc(20px + env(safe-area-inset-top));
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop{
      display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);
      z-index:40;opacity:0;pointer-events:none;transition:opacity .2s ease;
    }
    .sidebar-backdrop.show{opacity:1;pointer-events:auto;}

    .main{border-radius:0;}
    .menu-btn{display:flex;}
    .topbar{padding:calc(10px + env(safe-area-inset-top)) 12px 10px;}

    .profile-header{
      flex-direction:column;align-items:center;text-align:center;
      padding:20px 16px 16px;gap:10px;
    }
    .profile-header img{width:120px;height:120px;}
    .profile-header .kicker{justify-content:center;}
    .profile-header h1{font-size:34px;margin:4px 0 6px;word-break:break-word;}
    .profile-header .sub{justify-content:center;font-size:12px;}

    .action-row{padding:12px 16px 4px;justify-content:center;}
    .section-title{padding:20px 16px 6px;font-size:18px;}
    .track-list{padding:0 12px 16px;}

    .track-list-head{grid-template-columns:22px 1fr 56px;gap:8px;padding:0 6px 8px;}
    .track-list-head > div:nth-child(4){display:none;}
    .track-row{
      grid-template-columns:22px 1fr 56px;
      gap:8px;
      padding:10px 6px;
      min-height:56px;
      -webkit-tap-highlight-color:transparent;
    }
    .track-row .date-cell{display:none;}
    .title-cell img{width:36px;height:36px;}
    .title-text .t{font-size:14px;}
    .title-text .a{display:none;}
    .plays-cell{font-size:12px;text-align:right;}

    .albums-grid{padding:0 12px 20px;gap:14px;}
    .album-card{width:118px;}
    .album-card .art-wrap{width:118px;height:118px;}

    .nowplaying{
      position:sticky;
      bottom:0;
      z-index:20;
      margin:0;
      border-radius:0;
      gap:8px;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
      height:auto;
      min-height:76px;
    }
    .np-meta{width:auto;flex:1 1 auto;}
    .np-right{display:none;}
    .np-center{flex:2 1 auto;}
    .np-progress{max-width:none;}
    .np-time{width:28px;font-size:10px;}
    .np-transport{gap:14px;}
  }

  @media (max-width:420px){
    .profile-header h1{font-size:26px;}
    .profile-header img{width:96px;height:96px;}
    .np-meta img{width:44px;height:44px;}
    .np-meta .a{display:none;}
    .np-transport button[title="Previous"],
    .np-transport button[title="Next"]{display:none;}
    .album-card{width:104px;}
    .album-card .art-wrap{width:104px;height:104px;}
  }
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span>Spotify RL</div>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
      Label
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16" y2="16" stroke="currentColor" stroke-width="2"/></svg>
      Search
    </div>
    <hr>
    <div class="nav-item active">Tracks</div>
    <div class="nav-item">Likes</div>
    <div class="nav-item">Playlists</div>
    <hr>
    <div class="side-meta">
      <strong>WickedMurder©</strong>
      Independent • Label • Collective • Curator • Distributor<br><br>
      25,802 followers · 86.7K monthly listeners<br><br>
    </div>
  </div>

  <div class="main" id="main">
    <div class="topbar">
      <div class="topbar-nav">
        <button class="menu-btn circle-btn" id="menu-btn" title="Menu">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <button class="circle-btn">&#8592;</button>
        <button class="circle-btn">&#8594;</button>
      </div>
    </div>

    <div class="profile-header">
      <img src="https://i1.sndcdn.com/avatars-86C7dlqkmlZExP8z-4b3zTw-t500x500.jpg" alt="WickedMurder©">
      <div>
        <div class="kicker">
          <svg class="verified-badge" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="12" fill="#2e77ff"/>
            <path d="M9.9 16.2l-3.4-3.4 1.4-1.4 2 2 5.2-5.2 1.4 1.4z" fill="#fff"/>
          </svg>
          Record Label

<script>
  const ARTIST = "wickedmurder";

  const BAR_COUNT = 90;

  // without an authenticated API key, so these are not pulled from SoundCloud.
  const TRACKS = [

    { slug: "start-to-finish",          fallbackTitle: "start to finish",               date: "2026-01-22", plays: 37900 },
    { slug: "she-told-me",              fallbackTitle: "she told me",                   date: "2025-08-12", plays: 33200 },
    { slug: "look-away",                fallbackTitle: "look",                          date: "2026-02-06", plays: 28700 },
    { slug: "one-more-line",            fallbackTitle: "One More Line",                 date: "2025-10-10", plays: 24100 }
  ];

  // WickedMurder©'s albums/playlists (from soundcloud.com/wickedmurder/albums).
  // These are SoundCloud "sets", so the URL path is /wickedmurder/sets/<slug>.
  const ALBUMS = [
    { slug: "rabbit",     path: "sets/rabbit",   fallbackTitle: "1nf4my - rabbit",                          date: "2025-10-25" },
    { slug: "idtiwapm",   path: "sets/idtiwapm", fallbackTitle: "UOKSANE? - i dont think it was a phase mom", date: "2026-01-16" },
    { slug: "hatch",      path: "sets/hatch",    fallbackTitle: "1nf4my - hatch",                           date: "2025-08-12" },
    { slug: "dark-nights",path: "sets/dark-nights", fallbackTitle: "Nto.MakEleven - Dark Nights",           date: "2025-10-10" },
    { slug: "tlu",        path: "sets/tlu",      fallbackTitle: "1nf4my - things left unsaid",              date: "2025-08-18" }
  ];

  let currentWidget = null;
  let currentDurationMs = 0;
  let isPlaying = false;
  let lastVolume = 80;

  function formatDate(iso){
    try{
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
    }catch(e){ return iso; }
  }

  function fmtTime(ms){
    if(!ms && ms !== 0) return "0:00";
    let s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    s = s % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function fmtPlays(n){
    if(n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if(n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  function playIconSVG(){
    return '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  }

  function seededRandomFactory(seedStr){
    let h = 1779033703 ^ seedStr.length;
    for(let i = 0; i < seedStr.length; i++){
      h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    };
  }

  function buildWaveform(seedStr){
    const container = document.getElementById("waveform");
    container.innerHTML = "";
    const rand = seededRandomFactory(seedStr);
    let prev = 0.5;
    for(let i = 0; i < BAR_COUNT; i++){
      const target = 0.15 + rand() * 0.85;
      prev = prev * 0.55 + target * 0.45;
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.height = Math.round(prev * 100) + "%";
      container.appendChild(bar);
    }
    container.onclick = (e) => {
      if(!currentWidget || !currentDurationMs) return;
      const rect = container.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      currentWidget.seekTo(frac * currentDurationMs);
      setWaveformProgress(frac);
    };
  }

  function setWaveformProgress(frac){
    const bars = document.querySelectorAll("#waveform .bar");
    const playedCount = Math.round(frac * bars.length);
    bars.forEach((b, i) => b.classList.toggle("played", i < playedCount));
  }

  function setPlayingUI(playing){
    isPlaying = playing;
    document.getElementById("np-playicon").innerHTML = playing
      ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>'
      : '<path d="M8 5v14l11-7z"></path>';
    const hero = document.getElementById("hero-play");
    if(hero) hero.classList.toggle("is-playing", playing);
    const np = document.getElementById("nowplaying");
    if(np) np.classList.toggle("is-playing", playing);
  }

  function volumeIconSVG(vol){
    if(vol == 0){
      return '<path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.42.05-.63z"/><path d="M19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71z"/><path d="M4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L18.73 21 20 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
    }
    if(vol < 50){
      return '<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v8.06c1.5-.74 2.5-2.26 2.5-4.03z"/>';
    }
    return '<path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M14.5 12c0-1.77-1-3.29-2.5-4.03v8.06c1.5-.74 2.5-2.26 2.5-4.03z"/><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }

  function applyVolume(vol){
    document.getElementById("vol-slider").value = vol;
    const pct = vol + "%";
    document.getElementById("vol-slider").style.background =
      `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}, #4d4d4d ${pct}, #4d4d4d 100%)`;
    document.getElementById("vol-icon-svg").innerHTML = volumeIconSVG(vol);
    if(currentWidget) currentWidget.setVolume(vol);
  }

  function widgetSrc(url, autoplay){
    return "https://w.soundcloud.com/player/?url=" + encodeURIComponent(url) +
      "&auto_play=" + (autoplay ? "true" : "false") + "&hide_related=true&show_comments=false&show_user=false" +
      "&show_reposts=false&show_teaser=false&visual=false&single_active=true" +
      "&buying=false&sharing=false&download=false";
  }

  /*
   * MOBILE PLAYBACK FIX
   *
   * The old version recreated the SoundCloud iframe every time and waited for
   * iframe.onload -> Widget.READY -> setTimeout() -> widget.play().
   *
   * On iOS Safari and many Android browsers that loses the original tap's
   * user-activation by the time play() is called, so the browser silently
   * blocks playback.
   *
   * We now keep ONE SoundCloud widget alive for the entire page lifetime and
   * use Widget.load() from the actual tap/click handler with auto_play:true.
   * This avoids destroying the media context and gives SoundCloud's player
   * the best chance to consume the mobile user gesture.
   */

  let scEngine = null;
  let scEngineReady = false;
  let pendingTrack = null;
  let playbackRequestId = 0;

  function ensureSoundCloudWidget(){
    if(scEngine) return scEngine;

    const engine = document.getElementById("sc-audio-engine");
    if(!engine) return null;

    scEngine = SC.Widget(engine);

    scEngine.bind(SC.Widget.Events.READY, () => {
      scEngineReady = true;

      try{
        scEngine.setVolume(lastVolume);
      }catch(e){}

      if(pendingTrack){
        const track = pendingTrack;
        pendingTrack = null;
        loadTrackIntoWidget(track, ++playbackRequestId);
      }
    });

    scEngine.bind(SC.Widget.Events.PLAY, () => {
      setPlayingUI(true);
      document.getElementById("nowplaying").classList.add("is-playing");
      document.getElementById("hero-play").classList.add("is-playing");
    });

    scEngine.bind(SC.Widget.Events.PAUSE, () => {
      setPlayingUI(false);
      document.getElementById("nowplaying").classList.remove("is-playing");
      document.getElementById("hero-play").classList.remove("is-playing");
    });

    scEngine.bind(SC.Widget.Events.FINISH, () => {
      setPlayingUI(false);
      document.getElementById("nowplaying").classList.remove("is-playing");
      document.getElementById("hero-play").classList.remove("is-playing");
    });

    scEngine.bind(SC.Widget.Events.PLAY_PROGRESS, (e) => {
      document.getElementById("np-elapsed").textContent = fmtTime(e.currentPosition);
      const frac = currentDurationMs ? e.currentPosition / currentDurationMs : 0;
      setWaveformProgress(frac);
    });

    return scEngine;
  }

  /*
   * Some browsers/SoundCloud player versions don't report duration
   * immediately after load, so poll briefly without attempting another
   * autoplay operation. Shared by both playback paths below.
   */
  function pollDuration(requestId){
    let tries = 0;
    const durationTimer = setInterval(() => {
      if(requestId !== playbackRequestId){
        clearInterval(durationTimer);
        return;
      }

      if(!scEngine){
        clearInterval(durationTimer);
        return;
      }

      scEngine.getDuration((d) => {
        if(d){
          currentDurationMs = d;
          document.getElementById("np-duration").textContent = fmtTime(d);
          clearInterval(durationTimer);
        }
      });

      if(++tries > 40) clearInterval(durationTimer);
    }, 250);
  }

  function loadTrackIntoWidget(track, requestId){
    if(!scEngine || requestId !== playbackRequestId) return;

    const url = track.url || `https://soundcloud.com/${ARTIST}/${track.path || track.slug}`;

    currentWidget = scEngine;

    /*
     * IMPORTANT: auto_play:true is passed directly to SoundCloud's load()
     * instead of calling widget.play() later from setTimeout().
     *
     * On mobile this is substantially more reliable because the load request
     * originates from the same synchronous click/tap chain.
     */
    try{
      scEngine.load(url, {
        auto_play: true,
        hide_related: true,
        show_comments: false,
        show_user: false,
        show_reposts: false,
        show_teaser: false,
        visual: false,
        single_active: true,
        buying: false,
        sharing: false,
        download: false
      });
    }catch(e){
      console.warn("SoundCloud load failed:", e);
      setPlayingUI(false);
    }

    pollDuration(requestId);
  }

  function playTrack(track){
    /*
     * Everything above this point runs synchronously from the user's tap.
     * Do not insert await(), setTimeout(), or iframe recreation here.
     */
    track.url = track.url || `https://soundcloud.com/${ARTIST}/${track.path || track.slug}`;

    document.querySelectorAll(".track-row.playing, .album-card.playing")
      .forEach(r => r.classList.remove("playing"));

    const row =
      document.getElementById("row-" + track.slug) ||
      document.getElementById("album-" + track.slug);

    if(row) row.classList.add("playing");

    document.getElementById("np-title").textContent =
      track.title || track.fallbackTitle;

    document.getElementById("np-art").src = track.artwork || AVATAR;
    document.getElementById("nowplaying").classList.add("show");
    document.getElementById("np-elapsed").textContent = "0:00";
    document.getElementById("np-duration").textContent = "0:00";

    currentDurationMs = 0;
    buildWaveform(track.slug);

    const widget = ensureSoundCloudWidget();

    playbackRequestId++;
    const requestId = playbackRequestId;
    setPlayingUI(true);

    if(!widget || !scEngineReady){
      /*
       * MOBILE PLAYBACK FIX (part 2): the widget's postMessage handshake
       * (SC.Widget READY) usually hasn't finished yet on the first tap or two
       * right after page load, especially on slower mobile connections.
       *
       * Queuing the track and calling widget.load() later from the READY
       * callback (the old approach) runs that call outside the tap's
       * synchronous handler, which loses the user-activation the tap
       * granted -- so the browser silently blocks autoplay on iOS/Android.
       *
       * Instead, navigate the persistent engine iframe directly, with
       * auto_play baked straight into the URL, synchronously from this tap.
       * SoundCloud's player then autoplays as part of ITS OWN page load,
       * which still counts as a direct consequence of the gesture. The
       * existing READY handler above still fires for this fresh document
       * and just marks the engine ready from then on.
       */
      pendingTrack = null;
      currentWidget = scEngine;
      const engine = document.getElementById("sc-audio-engine");
      engine.src = widgetSrc(track.url, true);
      pollDuration(requestId);
      return;
    }

    loadTrackIntoWidget(track, requestId);
  }

  function togglePlayback(){
    if(!currentWidget) return;

    /*
     * toggle() is called directly from the mobile play button, preserving
     * user activation. If no track has loaded yet, there is nothing to toggle.
     */
    try{
      currentWidget.toggle();
    }catch(e){
      console.warn("SoundCloud toggle failed:", e);
    }
  }

  function buildRow(track, index){
    const row = document.createElement("div");
    row.className = "track-row";
    row.id = "row-" + track.slug;
    row.innerHTML = `
      <div class="idx-cell">
        <span class="idx-num">${index + 1}</span>
        <span class="idx-play">${playIconSVG()}</span>
      </div>
      <div class="title-cell">
        <img src="${track.artwork || AVATAR}" alt="">
        <div class="title-text">
          <div class="t">${track.title || track.fallbackTitle}</div>
          <div class="a">WickedMurder©</div>
        </div>
      </div>
      <div class="plays-cell">${fmtPlays(track.plays)}</div>
      <div class="date-cell">${formatDate(track.date)}</div>
    `;
    row.addEventListener("click", () => playTrack(track));
    return row;
  }

  async function fetchMeta(track){
    const trackUrl = `https://soundcloud.com/${ARTIST}/${track.path || track.slug}`;
    track.url = trackUrl;
    try{
      const res = await fetch(`https://soundcloud.com/oembed?format=json&url=${encodeURIComponent(trackUrl)}`);
      if(!res.ok) throw new Error("oEmbed failed");
      const data = await res.json();
      track.title = (data.title || "").replace(/\s+by\s+WickedMurder.*/i, "").trim() || track.fallbackTitle;
      if(data.thumbnail_url){
        track.artwork = data.thumbnail_url.replace("-large", "-t500x500");
      }
    }catch(e){
      track.title = track.fallbackTitle;
    }
    return track;
  }

  function buildAlbumCard(album){
    const card = document.createElement("div");
    card.className = "album-card";
    card.id = "album-" + album.slug;
    const year = (album.date || "").slice(0, 4);
    card.innerHTML = `
      <div class="art-wrap">
        <img src="${album.artwork || AVATAR}" alt="">
        <div class="play-overlay">${playIconSVG()}</div>
      </div>
      <div class="a-title">${album.title || album.fallbackTitle}</div>
      <div class="a-sub">${year} · Album</div>
    `;
    card.addEventListener("click", () => playTrack(album));
    return card;
  }

  async function renderAlbums(list, gridElId){
    const gridEl = document.getElementById(gridElId);
    list.forEach(a => gridEl.appendChild(buildAlbumCard(a)));

    for(let i = 0; i < list.length; i++){
      const album = await fetchMeta(list[i]);
      const existing = document.getElementById("album-" + album.slug);
      if(existing) existing.replaceWith(buildAlbumCard(album));
    }
  }

  async function renderList(list, rowsElId){
    const rowsEl = document.getElementById(rowsElId);
    list.forEach((t, i) => rowsEl.appendChild(buildRow(t, i)));

    for(let i = 0; i < list.length; i++){
      const track = await fetchMeta(list[i]);
      const existing = document.getElementById("row-" + track.slug);
      if(existing) existing.replaceWith(buildRow(track, i));
    }
  }

  function init(){
    /*
     * Initialize the SoundCloud widget once. Do NOT wait for this before
     * accepting a user's tap; playTrack() queues a request if initialization
     * is still in progress.
     *
     * A real SoundCloud URL is used so the cross-origin Widget API is ready
     * before the first mobile interaction. We do not autoplay this bootstrap
     * track.
     */
    const engine = document.getElementById("sc-audio-engine");
    engine.src = widgetSrc(`https://soundcloud.com/${ARTIST}/${TRACKS[0].slug}`, false);
    engine.onload = () => {
      ensureSoundCloudWidget();
    };

    renderList(TRACKS, "rows-tracks");
    renderAlbums(ALBUMS, "albums-grid");

    document.getElementById("hero-play").addEventListener("click", () => {
      if(TRACKS[0]) playTrack(TRACKS[0]);
    });
    document.getElementById("np-playbtn").addEventListener("click", togglePlayback);

    const slider = document.getElementById("vol-slider");
    applyVolume(lastVolume);
    slider.addEventListener("input", (e) => {
      lastVolume = parseInt(e.target.value, 10);
      applyVolume(lastVolume);
    });
    document.getElementById("vol-icon").addEventListener("click", () => {
      if(lastVolume > 0){
        slider.dataset.prev = lastVolume;
        lastVolume = 0;
      } else {
        lastVolume = parseInt(slider.dataset.prev || "80", 10);
      }
      applyVolume(lastVolume);
    });

    document.addEventListener("keydown", (e) => {
      if(e.code === "Space" || e.key === " "){
        e.preventDefault();
        togglePlayback();
      }
    });

    // Mobile sidebar drawer
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("sidebar-backdrop");
    const menuBtn = document.getElementById("menu-btn");
    function closeSidebar(){
      sidebar.classList.remove("open");
      backdrop.classList.remove("show");
    }
    if(menuBtn){
      menuBtn.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        backdrop.classList.toggle("show");
      });
    }
    backdrop.addEventListener("click", closeSidebar);
    document.querySelectorAll(".nav-item").forEach(item => {
      item.addEventListener("click", closeSidebar);
    });
  }

  init();
</script>
</body>
</html>
