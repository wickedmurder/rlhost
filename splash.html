<!-- ============ SPLASH SCREEN: copy everything from here to the end marker ============ -->
<style>
#mcs{--g:#22c55e;--g2:#4ade80;--ink:#dcf7e6;--bg:#03100a;--s:clamp(120px,24vmin,188px);
position:fixed;inset:0;z-index:2147483647;background:var(--bg);color:var(--ink);display:grid;place-items:center;overflow:hidden;
font-family:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",sans-serif;
transition:opacity .9s ease,transform .9s cubic-bezier(.6,0,.2,1),filter .9s ease;cursor:pointer}
#mcs *{box-sizing:border-box}
#mcs.mcs-out{opacity:0;transform:scale(1.06);filter:blur(8px);pointer-events:none}
#mcs .mcs-fx{position:absolute;inset:0;width:100%;height:100%}
#mcs .mcs-glow{position:absolute;inset:-20%;background:
radial-gradient(40% 40% at 30% 35%,rgba(34,197,94,.22),transparent 70%),
radial-gradient(35% 35% at 72% 68%,rgba(16,185,129,.18),transparent 70%),
radial-gradient(30% 30% at 50% 50%,rgba(74,222,128,.12),transparent 70%);
animation:mcs-drift 9s ease-in-out infinite alternate}
#mcs .mcs-grid{position:absolute;inset:0;opacity:0;background-image:linear-gradient(rgba(74,222,128,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(74,222,128,.07) 1px,transparent 1px);
background-size:56px 56px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0,transparent 62%);mask-image:radial-gradient(circle at 50% 50%,#000 0,transparent 62%);
animation:mcs-fade 1.6s .2s forwards,mcs-pan 14s linear infinite}
#mcs .mcs-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;transition:transform .6s ease,opacity .5s ease}
#mcs.mcs-out .mcs-stage{transform:scale(1.15);opacity:0}
#mcs .mcs-logo{position:relative;width:var(--s);height:var(--s);display:grid;place-items:center;margin-bottom:calc(var(--s)*.34)}
#mcs .mcs-badge{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;opacity:0;transform:scale(.2) rotate(-40deg);
animation:mcs-pop 1.1s .15s cubic-bezier(.34,1.56,.64,1) forwards,mcs-float 4.5s 1.3s ease-in-out infinite,mcs-pulse 2.6s 1.3s ease-in-out infinite}
#mcs .mcs-badge img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
#mcs .mcs-badge:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);
transform:translateX(-120%);animation:mcs-shine 2.8s 1.2s ease-in-out infinite}
#mcs .mcs-orbit{position:absolute;width:150%;height:150%;left:-25%;top:-25%;overflow:visible;opacity:0;animation:mcs-fade .8s .7s forwards}
#mcs .mcs-orbit circle{fill:none;stroke-linecap:round;transform-origin:100px 100px}
#mcs .mcs-track{stroke:rgba(74,222,128,.14);stroke-width:1}
#mcs .mcs-a1{stroke:var(--g2);stroke-width:2;stroke-dasharray:150 442;animation:mcs-spin 2.6s linear infinite;filter:drop-shadow(0 0 6px var(--g))}
#mcs .mcs-a2{stroke:#a7f3d0;stroke-width:1.5;stroke-dasharray:40 552;animation:mcs-spin 4.2s linear infinite reverse;opacity:.8}
#mcs .mcs-ripple{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--g2);opacity:0;animation:mcs-ripple 3s 1s cubic-bezier(.2,.6,.3,1) infinite}
#mcs .mcs-r2{animation-delay:2s}#mcs .mcs-r3{animation-delay:3s}
#mcs .mcs-word{margin:0;display:flex;font-weight:600;font-size:clamp(28px,6.4vmin,46px);letter-spacing:.14em;line-height:1;overflow:hidden;padding:.12em .1em}
#mcs .mcs-word span{display:inline-block;transform:translateY(115%);opacity:0;animation:mcs-rise .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(1.1s + var(--i)*.06s)}
#mcs .mcs-tag{margin:.9em 0 0;font-size:clamp(12px,2.2vmin,15px);letter-spacing:.04em;color:rgba(220,247,230,.62);opacity:0;animation:mcs-fade 1s 1.9s forwards}
#mcs .mcs-bar{position:relative;width:min(240px,56vw);height:2px;margin-top:2.2em;background:rgba(220,247,230,.12);border-radius:2px;overflow:hidden;opacity:0;animation:mcs-fade .6s 1.6s forwards}
#mcs .mcs-bar b{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--g),var(--g2));box-shadow:0 0 12px var(--g)}
#mcs .mcs-pct{margin-top:.9em;font-size:12px;font-variant-numeric:tabular-nums;color:rgba(220,247,230,.5);opacity:0;animation:mcs-fade .6s 1.7s forwards;min-width:3ch;text-align:center}
@keyframes mcs-pop{to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes mcs-float{50%{translate:0 -6px}}
@keyframes mcs-pulse{0%,100%{box-shadow:0 0 40px rgba(34,197,94,.35),0 0 90px rgba(34,197,94,.15)}50%{box-shadow:0 0 60px rgba(74,222,128,.6),0 0 130px rgba(34,197,94,.28)}}
@keyframes mcs-shine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@keyframes mcs-spin{to{transform:rotate(360deg)}}
@keyframes mcs-ripple{0%{transform:scale(.9);opacity:.55}100%{transform:scale(2.3);opacity:0}}
@keyframes mcs-rise{to{transform:none;opacity:1}}
@keyframes mcs-fade{to{opacity:1}}
@keyframes mcs-drift{to{transform:translate3d(4%,-3%,0) scale(1.1)}}
@keyframes mcs-pan{to{background-position:56px 56px}}
@media (prefers-reduced-motion:reduce){#mcs *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}#mcs .mcs-fx{display:none}}
</style>

    <h1 class="mcs-word" aria-label="Restify"></h1>
    <p class="mcs-tag"></p>
    <div class="mcs-bar"><b></b></div>
    <div class="mcs-pct">0%</div>
  </div>
</div>

<script>
(function(){
  /* ---- Settings ---- */
  var BRAND    = "Restify";            // wordmark text
  var TAGLINE  = "Powering up your music";  // line under the wordmark ("" to hide)
  var DURATION = 3600;                   // minimum splash time in ms
  var ONCE_PER_SESSION = false;          // true = only show on a visitor's first page view

  var el = document.getElementById("mcs");
  if (!el) return;
  try { if (ONCE_PER_SESSION && sessionStorage.getItem("mcs-seen")) { el.remove(); return; } } catch(e){}

  var word = el.querySelector(".mcs-word");
  BRAND.split("").forEach(function(ch,i){
    var s = document.createElement("span"); s.textContent = ch; s.style.setProperty("--i", i); word.appendChild(s);
  });
  el.querySelector(".mcs-tag").textContent = TAGLINE;

  var prevOverflow = document.documentElement.style.overflow;
  document.documentElement.style.setProperty("overflow","hidden","important");

  /* ---- Network of drifting nodes ---- */
  var cv = el.querySelector(".mcs-fx"), cx = cv.getContext("2d"), W, H, dpr, pts = [], raf, running = true;
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    var n = Math.round(Math.min(70, W*H/16000));
    pts = [];
    for (var i=0;i<n;i++) pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.4+.6});
  }
  function draw(){
    if (!running) return;
    cx.clearRect(0,0,W,H);
    var link = Math.min(150, W/5);
    for (var i=0;i<pts.length;i++){
      var p = pts[i]; p.x+=p.vx; p.y+=p.vy;
      if (p.x<0||p.x>W) p.vx*=-1; if (p.y<0||p.y>H) p.vy*=-1;
      for (var j=i+1;j<pts.length;j++){
        var q = pts[j], dx=p.x-q.x, dy=p.y-q.y, d=Math.sqrt(dx*dx+dy*dy);
        if (d<link){ cx.strokeStyle="rgba(74,222,128,"+(.16*(1-d/link))+")"; cx.lineWidth=1; cx.beginPath(); cx.moveTo(p.x,p.y); cx.lineTo(q.x,q.y); cx.stroke(); }
      }
      cx.fillStyle="rgba(134,239,172,.55)"; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill();
    }
    raf = requestAnimationFrame(draw);
  }
  size(); window.addEventListener("resize", size);
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) draw();

  /* ---- Progress + exit ---- */
  var bar = el.querySelector(".mcs-bar b"), pct = el.querySelector(".mcs-pct");
  var loaded = document.readyState === "complete", start = performance.now(), done = false;
  if (!loaded) window.addEventListener("load", function(){ loaded = true; });
  setTimeout(function(){ loaded = true; }, DURATION + 3000);   // safety: never hang
  function ease(t){ return 1 - Math.pow(1 - t, 3); }
  function tick(now){
    var t = Math.min((now - start) / DURATION, 1), v = ease(t);
    if (!loaded) v = Math.min(v, .92);          // wait for the page to finish loading
    bar.style.transform = "scaleX(" + v + ")";
    pct.textContent = Math.round(v * 100) + "%";
    if (v >= 1) return finish();
    requestAnimationFrame(tick);
  }
  function finish(){
    if (done) return; done = true;
    bar.style.transform = "scaleX(1)"; pct.textContent = "100%";
    setTimeout(function(){
      el.classList.add("mcs-out");
      setTimeout(function(){
        running = false; cancelAnimationFrame(raf);
        window.removeEventListener("resize", size);
        document.documentElement.style.removeProperty("overflow"); if (prevOverflow) document.documentElement.style.overflow = prevOverflow;
        el.remove();
        try { sessionStorage.setItem("mcs-seen", "1"); } catch(e){}
        window.dispatchEvent(new Event("splash:done"));
      }, 950);
    }, 350);
  }
  el.addEventListener("click", finish);           // click or tap to skip
  setTimeout(function(){ requestAnimationFrame(tick); }, 300);
})();
</script>
